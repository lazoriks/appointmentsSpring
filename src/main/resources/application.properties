spring.application.name=appointments

### Database connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

### JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

### Let Render control the port for test deploy and endpoint
server.port=${PORT:8080}

### Admin API key (required header X-Admin-Key on /api/admin/**)
admin.api-key=${ADMIN_API_KEY:}

### Admin login credentials — POST /api/auth/login exchanges these for admin.api-key
admin.username=${ADMIN_USERNAME:}
admin.password=${ADMIN_PASSWORD:}

### Booking notifications
### Email goes to the client and the salon; Telegram goes to the salon's group chat.
### Leave a value blank and that channel is simply skipped — bookings still work.
app.notifications.salon-email=${SALON_EMAIL:}
app.notifications.salon-name=${SALON_NAME:GLAM Beauty Salon}
app.notifications.salon-address=${SALON_ADDRESS:43 Thomas St, Limerick, V94 KW0Y}
app.notifications.salon-phone=${SALON_PHONE:+353 87 465 1181}
app.notifications.from-name=${MAIL_FROM_NAME:GLAM Beauty Salon}
app.notifications.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.notifications.telegram.chat-id=${TELEGRAM_CHAT_ID:}

### SMTP. With Gmail use an App Password (requires 2-Step Verification), not the account password.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

### Site photos (uploaded from the admin panel, shown on the WordPress home page)
app.site-images.bucket=${SITE_IMAGES_BUCKET:glamlimerick-site-images}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

### CORS (comma-separated list of allowed origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://glamlimerick.com,http://localhost:3000}